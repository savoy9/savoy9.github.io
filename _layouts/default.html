<!DOCTYPE html>
<html lang="{{ site.lang }}">
  <head>
    {% include meta.html %}
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    {% feed_meta %}
    <script src="{{ '/assets/notebook.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead shell">
      <a class="identity" href="{{ '/' | relative_url }}">
        <img src="{{ site.avatar | escape }}" alt="Alex Dupler" width="44" height="44">
        <strong>Alex Dupler</strong>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      </nav>
    </header>
    <main id="main" class="shell" tabindex="-1">
      {{ content }}
    </main>
    <footer class="footer shell">
      <nav aria-label="Elsewhere">
        {% include svg-icons.html %}
      </nav>
    </footer>
  </body>
</html>
